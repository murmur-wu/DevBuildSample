# Dependabot：每週檢查一次，有更新就開 PR（CI 會自動跑，合併後由 CD 部署）。
# 基底 image 以 digest 鎖定（見各 Dockerfile 與 deploy/docker-compose*.yml），平常部署只下載程式層；
# 基底更新一律透過這些 PR 進來，合併那次部署會比較久（要下載新的基底層）。
# 一律不自動提議主版本升級：postgres 17→18 資料格式不相容、node 22→24、.NET 10→11、FrankenPHP 1→2、Python 3.14→3.15、Spring Boot 4→5 需要評估，要升級時手動改。
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/api-dotnet
      - /apps/api-php
      - /apps/api-python
      - /apps/api-go
      - /apps/api-java
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(compose)"

  # Python 版的套件（requirements*.txt，版本以 == 鎖定）
  - package-ecosystem: pip
    directory: /apps/api-python
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    groups:
      python-packages:
        patterns: ["*"]
    commit-message:
      prefix: "chore(pip)"

  # Go 版的模組（go.mod）
  - package-ecosystem: gomod
    directory: /apps/api-go
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      go-modules:
        patterns: ["*"]
    commit-message:
      prefix: "chore(gomod)"

  # Java 版的套件（pom.xml，含 Spring Boot parent）
  - package-ecosystem: maven
    directory: /apps/api-java
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      maven-packages:
        patterns: ["*"]
    commit-message:
      prefix: "chore(maven)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(actions)"
