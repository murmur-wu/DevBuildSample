# Dependabot：每週檢查一次，有更新就開 PR（CI 會自動跑，合併後由 CD 部署）。
# 基底 image 以 digest 鎖定（見各 Dockerfile 與 deploy/docker-compose*.yml），平常部署只下載程式層；
# 基底更新一律透過這些 PR 進來，合併那次部署會比較久（要下載新的基底層）。
# 一律不自動提議主版本升級：postgres 17→18 資料格式不相容、node 22→24 與 .NET 10→11 需要評估，要升級時手動改。
version: 2
updates:
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/api-dotnet
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      base-images:
        patterns: ["*"]
    commit-message:
      prefix: "chore(docker)"

  - package-ecosystem: docker-compose
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(compose)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Taipei
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(actions)"
