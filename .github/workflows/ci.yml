name: CI
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start api + db
        run: ./scripts/local-up.sh
      - name: Smoke test
        run: ./scripts/smoke-test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -p myapp-local -f deploy/docker-compose.yml logs --no-color
        env:
          ENV_FILE: ${{ github.workspace }}/deploy/.env
      - name: Tear down
        if: always()
        run: ./scripts/local-up.sh clean
