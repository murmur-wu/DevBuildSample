name: CD (Web)
on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - .github/workflows/cd-web.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6
      - name: Check secrets
        run: |
          missing=()
          [[ -n "$CLOUDFLARE_API_TOKEN" ]] || missing+=(CLOUDFLARE_API_TOKEN)
          [[ -n "$CLOUDFLARE_ACCOUNT_ID" ]] || missing+=(CLOUDFLARE_ACCOUNT_ID)
          if (( ${#missing[@]} )); then
            echo "::error title=缺少 GitHub secret::請到 repo Settings → Secrets and variables → Actions 新增：${missing[*]}（建立方式見 README「前端」）"
            exit 1
          fi
      - name: 安裝 wrangler
        working-directory: apps/web
        run: npm ci
      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          command: deploy
      - name: Smoke test（瀏覽器 → Worker → Tunnel → 後端，整條路）
        env:
          URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          if [[ -z "$URL" ]]; then
            echo "::error::wrangler 沒有回報部署網址"
            exit 1
          fi
          echo "部署網址：$URL" >> "$GITHUB_STEP_SUMMARY"
          curl -fsS "$URL/" | grep -q '<title>DevBuildSample'
          ./scripts/smoke-test.sh "$URL/api/node"
          ./scripts/smoke-test.sh "$URL/api/dotnet"
