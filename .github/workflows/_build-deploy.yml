# 共用的 build + deploy 流程，由各版的 cd-*.yml（node、dotnet、php、python、go、java）呼叫。
# build：GitHub 雲端建置 image 推到 Docker Hub（tag = <版本>-<git SHA>）；有 image_tag（回滾）時跳過。
# deploy：在 self-hosted runner（label staging）上 pull + up，再跑 /health 與 smoke test。
#
# image 放在 Docker Hub 的一個 private repo，六個後端以 tag 前綴區分（免費方案只有 1 個 private repo）。
# 原本放 GHCR，但 buildserver 從 GHCR 下載只有約 35–70KB/s（Docker Hub 約 6MB/s 以上），見 docs/adr/0007。
# 需要 repo secrets：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN（Read & Write 的 access token），呼叫端以 secrets: inherit 傳入。
name: build-deploy

on:
  workflow_call:
    inputs:
      tag_prefix:
        description: image tag 的前綴（各版的 key），例如 node、dotnet、go
        type: string
        required: true
      context:
        description: docker build context，例如 ./apps/api
        type: string
        required: true
      compose_file:
        type: string
        required: true
      project:
        description: compose project 名稱，例如 myapp、myapp-dotnet、myapp-go
        type: string
        required: true
      port:
        description: 主機上 127.0.0.1 的對外 port
        type: number
        required: true
      path_base:
        description: 對外網址的路徑前綴（與 compose 的 PATH_BASE 相同），例如 /node、/dotnet、/go
        type: string
        required: true
      image_tag:
        description: 回滾用的舊 git SHA；空白表示建置並部署目前 commit
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

env:
  IMAGE_REPO: docker.io/murmur20260202/devbuildsample

jobs:
  build:
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest        # 雲端 build，不吃 VM 資源
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ inputs.context }}
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          # <key>-latest 方便手動操作；部署一律用 <key>-<SHA>
          tags: |
            ${{ env.IMAGE_REPO }}:${{ inputs.tag_prefix }}-${{ github.sha }}
            ${{ env.IMAGE_REPO }}:${{ inputs.tag_prefix }}-latest

  deploy:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: [self-hosted, staging]   # ← 指到 buildserver 上的 cd-vm
    # 整個 job 的上限（pull 20 + 啟動 5 + 其他步驟），避免卡住時擋住後面排隊的部署
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      IMAGE_TAG: ${{ inputs.tag_prefix }}-${{ inputs.image_tag || github.sha }}
      ENV_FILE: /srv/myapp/.env
      COMPOSE: docker compose -p ${{ inputs.project }} -f ${{ inputs.compose_file }}
      BASE_URL: http://127.0.0.1:${{ inputs.port }}
    steps:
      - uses: actions/checkout@v7
      - name: Check env file
        run: |
          if [[ ! -r "$ENV_FILE" ]]; then
            echo "::error title=找不到 $ENV_FILE::runner（$(whoami)@$(hostname)）讀不到 $ENV_FILE。請在這台機器上以 deploy 身分建立（chmod 600，內容參考 deploy/.env.example；步驟見 README「部署到 staging VM」），再按 Re-run failed jobs。"
            exit 1
          fi
          if ! grep -q '^POSTGRES_PASSWORD=.' "$ENV_FILE"; then
            echo "::error title=$ENV_FILE 設定不完整::$ENV_FILE 裡沒有設定 POSTGRES_PASSWORD（參考 deploy/.env.example）。"
            exit 1
          fi
          echo "$ENV_FILE OK"
      # 登入後下載 private repo 的 image；postgres 等公開 image 也改以登入身分下載（下載次數額度較高）
      - name: Login Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
      # 下載與啟動分開設上限：
      # - pull：基底 image 鎖定 digest 後平常只下載幾 KB，約 10–20 秒；基底更新或網路慢時可能要好幾分鐘，給足 20 分鐘
      # - up --wait：正常 5–10 秒就 healthy；超過 3 分鐘多半是容器一直重啟，直接失敗並由 Logs on failure 印出 log
      - name: Pull images
        timeout-minutes: 20
        run: $COMPOSE pull
      - name: Deploy
        timeout-minutes: 5
        run: $COMPOSE up -d --wait --wait-timeout 180
      - name: Verify
        run: curl -fsS "$BASE_URL/health"
      - name: Smoke test
        run: ./scripts/smoke-test.sh "$BASE_URL"
      - name: Smoke test（帶路徑前綴，模擬經 tunnel 的請求）
        run: ./scripts/smoke-test.sh "$BASE_URL${{ inputs.path_base }}"
      - name: Logs on failure
        if: failure()
        run: $COMPOSE logs --no-color --tail 100
      - name: Logout Docker Hub
        if: always()
        run: docker logout
