name: CD (Java)
on:
  push:
    branches: [main]
    paths:
      - apps/api-java/**
      - deploy/docker-compose.java.yml
      - scripts/smoke-test.sh
      - .github/workflows/cd-java.yml
      - .github/workflows/_build-deploy.yml
  workflow_dispatch:
    inputs:
      image_tag:
        description: 回滾用：填舊的 git SHA（須是改用 Docker Hub 之後的 commit），只跑 deploy
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-staging-java
  cancel-in-progress: false

jobs:
  cd:
    uses: ./.github/workflows/_build-deploy.yml
    with:
      tag_prefix: java
      context: ./apps/api-java
      compose_file: deploy/docker-compose.java.yml
      project: myapp-java
      port: 3005
      path_base: /java
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit   # DOCKERHUB_USERNAME、DOCKERHUB_TOKEN
