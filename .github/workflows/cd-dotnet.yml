name: CD (.NET)
on:
  push:
    branches: [main]
    paths:
      - apps/api-dotnet/**
      - deploy/docker-compose.dotnet.yml
      - scripts/smoke-test.sh
      - .github/workflows/cd-dotnet.yml
      - .github/workflows/_build-deploy.yml
  workflow_dispatch:
    inputs:
      image_tag:
        description: 回滾用：填舊的 git SHA（須是改用 Docker Hub 之後的 commit），只跑 deploy
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-staging-dotnet
  cancel-in-progress: false

jobs:
  cd:
    uses: ./.github/workflows/_build-deploy.yml
    with:
      tag_prefix: dotnet
      context: ./apps/api-dotnet
      compose_file: deploy/docker-compose.dotnet.yml
      project: myapp-dotnet
      port: 3001
      path_base: /dotnet
      image_tag: ${{ inputs.image_tag }}
    secrets: inherit   # DOCKERHUB_USERNAME、DOCKERHUB_TOKEN
