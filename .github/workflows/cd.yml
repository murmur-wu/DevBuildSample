name: CD
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 回滾用：填舊的 git SHA，只跑 deploy
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !inputs.image_tag }}
    runs-on: ubuntu-latest        # 雲端 build，不吃 VM 資源
    steps:
      - uses: actions/checkout@v4
      - name: Image name (GHCR 需全小寫)
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          build-args: APP_VERSION=${{ github.sha }}
          tags: ${{ env.IMAGE_REPO }}:${{ github.sha }}

  deploy:
    needs: build
    if: ${{ always() && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: [self-hosted, staging]   # ← 指到你的 VM
    env:
      IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
      ENV_FILE: /srv/myapp/.env
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        run: echo "IMAGE_REPO=ghcr.io/${GITHUB_REPOSITORY,,}/api" >> "$GITHUB_ENV"
      - name: Login GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: Deploy
        run: |
          docker compose -p myapp -f deploy/docker-compose.yml pull
          docker compose -p myapp -f deploy/docker-compose.yml up -d --wait
      - name: Verify
        run: curl -fsS http://127.0.0.1:3000/health
      - name: Smoke test
        run: ./scripts/smoke-test.sh http://127.0.0.1:3000
      - name: Logout GHCR
        if: always()
        run: docker logout ghcr.io
