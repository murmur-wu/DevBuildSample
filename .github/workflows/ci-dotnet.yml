name: CI (.NET)
on:
  pull_request:
    paths:
      - apps/api-dotnet/**
      - deploy/docker-compose.dotnet.yml
      - deploy/docker-compose.dotnet.local.yml
      - scripts/local-up.sh
      - scripts/smoke-test.sh
      - .github/workflows/ci-dotnet.yml
  push:
    branches: [main]
    paths:
      - apps/api-dotnet/**
      - deploy/docker-compose.dotnet.yml
      - deploy/docker-compose.dotnet.local.yml
      - scripts/local-up.sh
      - scripts/smoke-test.sh
      - .github/workflows/ci-dotnet.yml

permissions:
  contents: read

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: dotnet test（在 .NET 10 SDK 容器中執行，與本機相同）
        run: |
          docker run --rm -v "$PWD/apps/api-dotnet:/src" -w /src \
            -e DOTNET_CLI_TELEMETRY_OPTOUT=1 -e DOTNET_NOLOGO=1 \
            mcr.microsoft.com/dotnet/sdk:10.0 \
            dotnet test --logger "console;verbosity=normal"

  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Build and start api + db
        run: ./scripts/local-up.sh dotnet
      - name: Smoke test
        run: ./scripts/smoke-test.sh http://127.0.0.1:3001
      - name: Smoke test（帶路徑前綴 /dotnet）
        run: ./scripts/smoke-test.sh http://127.0.0.1:3001/dotnet
      - name: 請求紀錄
        run: |
          logs=$(./scripts/local-up.sh dotnet logs)
          # 每個請求一行「方法 路徑 狀態碼 耗時」，路徑含前綴
          grep -Eq 'POST /dotnet/items 201 [0-9]+ms$' <<<"$logs" || { echo "::error::缺少 POST /dotnet/items 的請求紀錄"; echo "$logs"; exit 1; }
          grep -Eq 'GET /dotnet/items/abc 404 [0-9]+ms$' <<<"$logs" || { echo "::error::缺少 404 的請求紀錄"; exit 1; }
          # 成功的 /health 不記錄（healthcheck 會洗版）
          if grep -Eq 'GET (/dotnet)?/health 200 ' <<<"$logs"; then echo "::error::成功的 /health 不應該被記錄"; exit 1; fi
      - name: Logs on failure
        if: failure()
        run: ./scripts/local-up.sh dotnet logs
      - name: Tear down
        if: always()
        run: ./scripts/local-up.sh dotnet clean
