# Go 版部署用 compose（compose project：myapp-go）。與其他各版完全獨立：
# 各自的 DB 容器與 volume，互不影響；對外 port 3004（各版的 port 見 CLAUDE.md）。
# 本地測試請用 scripts/local-up.sh go（會疊加 docker-compose.go.local.yml 改成本地 build）。

# 容器 log 上限：每個服務最多 3 個 10MB 檔，避免 log 把磁碟吃滿
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ${IMAGE_REPO:-ghcr.io/murmur-wu/devbuildsample/api-go}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging: *logging
    env_file: ${ENV_FILE:-/srv/myapp/.env}   # 與其他各版共用同一份機敏設定
    environment:
      DB_HOST: db
      PATH_BASE: /go                        # 對外網址 https://api-staging.heitang.info/go/...
    ports: ["127.0.0.1:3004:8080"]          # 容器內 8080（Go 標準函式庫 net/http），只綁 localhost，對外交給 tunnel
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 3

  db:
    # 以 digest 鎖定：否則官方更新時每次部署都會重新下載並重建 DB 容器；更新由 Dependabot 開 PR
    image: postgres:17@sha256:f4c66b820c6f974249089d3d16d86a3698eae11e8746eb6644b2271031e91232
    restart: unless-stopped
    logging: *logging
    env_file: ${ENV_FILE:-/srv/myapp/.env}   # 需含 POSTGRES_PASSWORD
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
