<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DevBuildSample 待辦清單</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%232563eb'/%3E%3Cpath d='M4 8.5l2.5 2.5L12 5' stroke='white' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main class="card">
    <header class="top">
      <h1>待辦清單</h1>
      <div class="backend" role="radiogroup" aria-label="後端">
        <button type="button" role="radio" data-backend="node" aria-checked="true">Node</button>
        <button type="button" role="radio" data-backend="dotnet" aria-checked="false">.NET</button>
        <button type="button" role="radio" data-backend="php" aria-checked="false">PHP</button>
        <button type="button" role="radio" data-backend="py" aria-checked="false">Python</button>
        <button type="button" role="radio" data-backend="go" aria-checked="false">Go</button>
        <button type="button" role="radio" data-backend="java" aria-checked="false">Java</button>
      </div>
    </header>

    <p class="status" id="status" aria-live="polite">連線中…</p>

    <form id="add-form" class="add" autocomplete="off">
      <label class="visually-hidden" for="new-name">新增項目</label>
      <input id="new-name" name="name" maxlength="200" placeholder="新增一個待辦事項" required>
      <button type="submit">新增</button>
    </form>

    <p class="error" id="error" role="alert" hidden></p>

    <ul class="items" id="items" aria-live="polite"></ul>
    <p class="empty" id="empty" hidden>還沒有任何項目。</p>

    <footer class="foot">
      資料來自 <code id="api-path">/api/node</code>，由 Worker 代轉到後端。
      <a href="/docs/">API 文件（Swagger）</a>
    </footer>
  </main>

  <template id="item-template">
    <li class="item">
      <label class="check">
        <input type="checkbox">
        <span class="name"></span>
      </label>
      <time class="created"></time>
      <button type="button" class="delete" aria-label="刪除">✕</button>
    </li>
  </template>
</body>
</html>
