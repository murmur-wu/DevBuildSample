# 設定值都從環境變數讀（compose 的 env_file 與 environment），與其他版相同
spring.main.banner-mode=off
server.port=8080

spring.datasource.url=jdbc:postgresql://${DB_HOST:db}:${DB_PORT:5432}/${POSTGRES_DB:postgres}?connectTimeout=2
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:}
# 連線池最多 5 條（與 Node 版的 pg.Pool 相同）；取得連線最多等 2 秒，DB 連不上時 /health 會回 503
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=2000

# JSON 欄位用 snake_case（created_at、updated_at）
spring.jackson.property-naming-strategy=SNAKE_CASE

# 不提供靜態檔案，找不到路由時丟 NoHandlerFoundException，由 ApiErrors 回 {"error":"not found"}
spring.web.resources.add-mappings=false
server.error.whitelabel.enabled=false
# 找不到路由時 Spring 會多印一行 WARN（No mapping for ...）；請求紀錄已經有這筆，不再重複
logging.level.org.springframework.web.servlet.PageNotFound=ERROR
